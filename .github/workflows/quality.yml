name: MoonWitness V11 Quality Gates
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Auth security regression tests
        run: npm test
      - name: Drizzle migration reproducibility check
        run: npm run db:check
      - name: Full dependency security audit
        run: npm audit
      - name: Next.js production build (without DB secret)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Local HTTP and visual asset smoke
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/moonwitness-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/moonwitness-next.log
            exit 1
          fi
          SMOKE_PROFILE=local SMOKE_BASE_URL=http://127.0.0.1:3000 SMOKE_EXPECT_CSP=1 npm run smoke:http
